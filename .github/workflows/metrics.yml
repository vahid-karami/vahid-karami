# Builds github-metrics.svg (the card shown in README.md) with lowlighter/metrics.
# Needs a repository secret named METRICS_TOKEN (see setup notes).
name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # every day at 00:00 UTC
  workflow_dispatch:       # lets you run it by hand from the Actions tab

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # allows the action to commit github-metrics.svg
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: vahid-karami
          filename: github-metrics.svg
          template: classic
          # Same sections as the example: header, activity, community stats,
          # repositories, and the footer with the update time
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tehran
          # "Most used languages" bar
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
